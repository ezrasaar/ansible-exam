---
- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install Ubuntu Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-apt
      - python3-debian
    state: present

- name: Create Docker keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Add official Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  notify: Refresh Docker APT cache
