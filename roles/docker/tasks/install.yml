---
- name: Import official Docker GPG key on Fedora
  ansible.builtin.rpm_key:
    key: https://download.docker.com/linux/fedora/gpg
    fingerprint: "060A 61C5 1B55 8A7F 742B 77AA C52F EB6B 621E 9F35"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Docker Engine on Ubuntu
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker Engine on Fedora
  ansible.builtin.dnf5:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Start and enable Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add student to Docker group
  ansible.builtin.user:
    name: student
    groups: docker
    append: true

- name: Refresh SSH connection after Docker group membership
  ansible.builtin.meta: reset_connection

- name: Ensure Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Docker log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: Restart docker

- name: Apply pending Docker configuration changes
  ansible.builtin.meta: flush_handlers
